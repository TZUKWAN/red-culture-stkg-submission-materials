   </g>
   <g id="text_9">
    <text style="font-size: 8.6px; font-family: 'Times New Roman', 'SimSun'; fill: #2b2b2b" transform="translate(574.585641 231.954075)">升级裁决（LLM）</text>
    <text style="font-size: 8.6px; font-family: 'Times New Roman', 'SimSun'; fill: #2b2b2b" transform="translate(587.962 242.364644)">或保持未决</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'Times New Roman', 'SimSun'; text-anchor: start; fill: #6b6b6b" x="383.472" y="326.527687" transform="rotate(-0 383.472 326.527687)">θ(c)：验证支持数≥50、精确率≥0.98、Wilson 下限≥0.95 的最低档；δ(c)=0；独立信号=严格词法/Schema 投票</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13.5px; font-family: 'Times New Roman', 'SimSun'; text-anchor: middle; fill: #2b2b2b" x="383.472" y="18.379687" transform="rotate(-0 383.472 18.379687)">自动接受门 g(x)：四条件合取的选择性预测门禁（论文 §3.2）</text>
   </g>
  </g>
