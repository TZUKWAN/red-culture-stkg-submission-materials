    <text style="font-size: 9px; font-family: 'Times New Roman', 'SimSun'; text-anchor: middle; fill: #2b2b2b" x="305.352" y="74.250094" transform="rotate(-0 305.352 74.250094)">置信度 L(x) ≥ θ(c) ?</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'SimSun'; text-anchor: middle; fill: #2b2b2b" x="305.352" y="140.778094" transform="rotate(-0 305.352 140.778094)">概率间隔 Δ(x) ≥ δ(c) ?</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'SimSun'; text-anchor: middle; fill: #2b2b2b" x="305.352" y="207.270937" transform="rotate(-0 305.352 207.270937)">独立信号 C(x) ≥ 1 ?</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'Times New Roman', 'SimSun'; text-anchor: middle; fill: #2b2b2b" x="305.352" y="273.728625" transform="rotate(-0 305.352 273.728625)">强反证 H(x) = 0 ?</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', 'SimSun'; fill: #2b2b2b" transform="translate(467.733094 137.058062)">g(x) = 1</text>
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', 'SimSun'; fill: #2b2b2b" transform="translate(453.912 149.182125)">自动接受资格</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10px; font-family: 'Times New Roman', 'SimSun'; fill: #2b2b2b" transform="translate(467.733094 259.026062)">g(x) = 0</text>
